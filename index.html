<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inventory Scanner V2</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<div class="container">


    <h1>📦 Inventory Scanner</h1>



    <!-- Current Mode -->

    <div id="modeBanner" class="mode-banner">

        🟢 CURRENT MODE : IN

    </div>





    <!-- IN / OUT -->


    <div class="mode-buttons">


        <button id="btnIn" class="mode-btn active">

            🟢 IN

        </button>



        <button id="btnOut" class="mode-btn">

            ⚪ OUT

        </button>


    </div>






    <!-- Barcode -->


    <div class="form-group">


        <label>Barcode</label>


        <input

            type="text"

            id="barcode"

            placeholder="Waiting for Scan..."

            readonly>


    </div>






    <!-- Camera -->


    <div class="form-group">


        <label>Camera</label>


        <div id="reader"></div>


    </div>







    <!-- Batch -->


    <div class="form-group">


        <label>Batch No.</label>


        <input

            type="text"

            id="batch"

            placeholder="Enter Batch No.">


    </div>







    <!-- Pieces -->


    <div class="form-group">


        <label>Pieces</label>


        <input

            type="number"

            id="pieces"

            placeholder="0">


    </div>








    <!-- Cartons -->


    <div class="form-group">


        <label>Cartons</label>


        <input

            type="number"

            id="cartons"

            placeholder="0">


    </div>








    <!-- Qty -->


    <div class="form-group">


        <label>Qty (KG)</label>


        <input

            type="number"

            id="qty"

            placeholder="0">


    </div>








    <!-- Written By -->


    <div class="form-group">


        <label>Written By</label>


        <select id="writer">


            <option value="">

                Select Staff

            </option>


            <option>Sitong</option>

            <option>Yazhen</option>

            <option>JIANGHUA</option>

            <option>KM</option>

            <option>KY</option>

            <option>Kyaw</option>


        </select>


    </div>









    <!-- Submit -->


    <button id="submitBtn">


        ENTER / SUBMIT


    </button>



</div>







<!-- QR Scanner Library -->


<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>





<!-- Scan Sound -->


<audio id="scanSound" preload="auto">

    <source

    src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg"

    type="audio/ogg">

</audio>






<!-- Main Script -->


<script src="script.js"></script>




</body>


</html>
